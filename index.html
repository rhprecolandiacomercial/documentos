<meta property="og:title" content="Requisição de Vagas">
<meta property="og:description" content="Peça uma nova vaga ou envie documentos de candidatos ao RH.">

<meta property="og:image" content="https://rhprecolandiacomercial.github.io/documentos/preview.jpg">

<style>body{font-family:Arial,Helvetica,sans-serif;background:#FBFAFC;color:#241A33;text-align:center;padding:48px 20px;}a{color:#4D2885;font-weight:bold;}</style>
</head>
<body>
<p id="m">Carregando...</p>
<script>
  // Roteador: o formulário de requisição fica aqui; os demais links continuam no sistema (Apps Script).
  var APPS = 'https://script.google.com/macros/s/AKfycbwTbfx5XVEFopj5n2-0KxskVMGy95zL5WTWwSQaGKrCdoLCPHWcHufPa8-afcDUwglv/exec';
  var q = location.search.replace(/^\?/, '').replace(/(^|&)v=[^&]*/, '').replace(/^&/, '');
  var m = document.getElementById('m');
  if (q && !/^[A-Za-z0-9_\-.~%=&+]+$/.test(q)) {
    m.innerHTML = 'Link inválido. Peça um novo link ao RH da Preçolândia.';
  } else {
    var view = (/(^|&)view=([^&]*)/.exec(q) || [])[2] || '';
    var soT = /^t=[0-9a-fA-F-]{36}$/.test(q);
    var destino;
    if (!q || view === 'corrigir') destino = 'requisicao.html' + (q ? '?' + q : '');
    else if (soT) destino = 'docs.html?' + q;
    else destino = APPS + '?' + q;
    location.replace(destino);
    setTimeout(function(){ m.innerHTML = 'Se a página não abrir, <a href="' + destino + '">toque aqui</a>.'; }, 6000);
  }
</script>
</body>
</html>

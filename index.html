<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Documentos de admissão — Preçolândia</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FBFAFC; font-family:Arial,Helvetica,sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#FBFAFC; }
  .aviso { padding:40px 20px; text-align:center; color:#241A33; }
  .aviso a { color:#4D2885; font-weight:bold; }
</style>
</head>
<body>
<div id="msg" class="aviso">Carregando...</div>
<script>
  // Endereço da página de documentos (implantação do Apps Script). Só o "token" do link do candidato muda.
  var BASE = 'https://script.google.com/macros/s/AKfycbwTbfx5XVEFopj5n2-0KxskVMGy95zL5WTWwSQaGKrCdoLCPHWcHufPa8-afcDUwglv/exec';
  var m = /[?&]t=([0-9a-fA-F-]{36})(?:&|$)/.exec(location.search);
  var msg = document.getElementById('msg');
  if (!m) {
    msg.innerHTML = '<h2>Link incompleto</h2><p>Peça um novo link ao RH da Preçolândia.</p>';
  } else {
    var url = BASE + '?view=docs&t=' + m[1];
    var f = document.createElement('iframe');
    f.src = url;
    f.title = 'Documentos de admissão';
    f.setAttribute('allow', 'camera; clipboard-write; fullscreen');
    f.onload = function(){ msg.style.display = 'none'; };
    document.body.appendChild(f);
    setTimeout(function(){ if (msg.style.display !== 'none') msg.innerHTML = 'Se a página não abrir, <a href="' + url + '">toque aqui</a>.'; }, 8000);
  }
</script>
</body>
</html>
